<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>关键词高亮测试页</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; line-height: 1.9; color: #222; }
  code { background: #f1f3f5; padding: 2px 5px; border-radius: 4px; }
  button { padding: 8px 14px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<h1>关键词高亮测试页</h1>
<p>Chrome 是一款流行的浏览器。这里小写的 chrome 与大写的 CHROME 用于验证大小写选项。</p>
<p>这一段包含「高亮」与「测试」等中文关键词，用于验证逐词着色效果。</p>
<p><code>const chrome = "Chrome inside code block";</code>（code 内不应被高亮）</p>
<p><input id="box" value="Chrome inside input" style="width:320px">（可编辑输入框不应着色）</p>
<p><input id="ro" readonly value="进度比例 Chrome 已完成" style="width:320px">（只读输入框应整框着色）</p>
<p>
  <select disabled>
    <option selected>Chrome 已完成阶段</option>
  </select>
  （禁用下拉框应整框着色）
</p>
<button id="add">动态追加一段文字</button>
<div id="dyn"></div>
<iframe src="iframe.html" style="width:100%;height:80px;border:1px solid #ccc"></iframe>
<script>
  document.getElementById('add').onclick = () => {
    const p = document.createElement('p');
    p.textContent = '动态插入的段落：Chrome 与 高亮 出现在新内容里也会被扫描到。';
    document.getElementById('dyn').appendChild(p);
  };
</script>
</body>
</html>
